<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Same viewport contract as the game (ADR-0010): the measurement is only
         worth having if it is taken at the size the game is played at. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <title>Aphelion · M0.5 renderer spike</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #000;
        overflow: hidden;
        position: fixed;
        inset: 0;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        color: #edeaf7;
        font:
          11px/1.5 ui-monospace,
          'SFMono-Regular',
          Menlo,
          monospace;
      }
      #app {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* The canvas host is sized in JS to the letterboxed design rect. Each
         candidate appends its own canvas here and removes it on dispose — a
         canvas can only ever have one kind of context, so they cannot share. */
      #stage {
        position: relative;
        overflow: hidden;
        background: #0a0814;
      }
      #panel {
        position: absolute;
        inset: 0;
        padding: 18px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
        background: rgba(10, 8, 20, 0.94);
        overflow-y: auto;
      }
      /* During a run the panel is out of the way entirely, not merely
         transparent: an overlay the compositor still has to blend is a cost
         inside the measurement. */
      #panel.running {
        background: none;
        pointer-events: none;
        justify-content: flex-start;
      }
      #panel.running > :not(.progress) {
        display: none;
      }
      h1 {
        font-size: 13px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        margin: 0;
        color: #fff4e0;
      }
      .hint {
        margin: 0;
        color: #6c64a6;
      }
      .facts {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        color: #6c64a6;
      }
      .facts b {
        color: #edeaf7;
      }
      .progress {
        margin: 0;
        padding: 6px 10px;
        background: rgba(10, 8, 20, 0.9);
        color: #fff4e0;
        align-self: flex-start;
      }
      button {
        appearance: none;
        border: 1px solid #6c64a6;
        background: none;
        color: #fff4e0;
        font: inherit;
        letter-spacing: 0.18em;
        padding: 14px;
        cursor: pointer;
      }
      button.ghost {
        border-color: #2a2440;
        color: #6c64a6;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        text-align: right;
        color: #6c64a6;
        font-weight: 400;
        padding: 3px 0;
      }
      td {
        text-align: right;
        padding: 3px 0;
        border-top: 1px solid #1c1830;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      td.key {
        color: #fff4e0;
      }
      tr.pass td.key {
        color: #7fe0a8;
      }
      tr.fail td.key {
        color: #ff5fa2;
      }
      tr.off td {
        color: #46516b;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage"></div>
      <div id="panel"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
