<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Mobile portrait is the design target (ADR-0010): the viewport is pinned
         so a double-tap cannot zoom the game out from under a player whose
         entire input is tapping, and `viewport-fit=cover` lets the field reach
         under the notch while the safe-area insets keep readable things out of
         it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <!-- VOID. The sky is the darkest thing on screen and the browser chrome
         should not be brighter than it. -->
    <meta name="theme-color" content="#000000" />
    <title>Aphelion</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        /* iOS raises a selection loupe and a Look Up menu on a long press or a
           quick double tap. The game's whole input is pressing and holding, so
           all three mechanisms — selection, the callout menu and the gesture —
           are turned off here. */
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        background: #000;
        overflow: hidden;
        /* `position: fixed` rather than `overflow: hidden` alone: iOS Safari
           rubber-bands the document on a drag regardless of the latter. */
        position: fixed;
        inset: 0;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* The game. Everything the player reads is drawn inside it, in world space
         in design coordinates (spec 00 §7). */
      #app {
        position: absolute;
        inset: 0;
      }
      /* Developer chrome, and spec 00 §7 rules that DOM is nothing else. It sits
         at the top because the bottom third of the screen is the thumb's, and a
         button there would eat presses meant for the game. */
      #chrome {
        position: absolute;
        top: max(8px, env(safe-area-inset-top));
        left: max(8px, env(safe-area-inset-left));
        right: max(8px, env(safe-area-inset-right));
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        color: #46516b;
        font:
          10px/1.6 ui-monospace,
          'SFMono-Regular',
          Menlo,
          monospace;
        letter-spacing: 0.14em;
        pointer-events: none;
      }
      #readout {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #reset {
        pointer-events: auto;
        flex: none;
        background: transparent;
        border: 1px solid #2a2740;
        border-radius: 3px;
        color: #46516b;
        font: inherit;
        letter-spacing: inherit;
        padding: 6px 10px;
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="chrome"><span id="readout"></span><button id="reset" type="button">RESET</button></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
