<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <title>Aphelion</title>
    <style>
      /* Without this, `width: 100%` plus padding and border overflows its
         container — which pushed the panel's controls off the right edge. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        /* iOS pops a selection loupe and a Look Up / Search menu on a long press
           or a quick double tap, and the game's whole input is tapping. Three
           separate mechanisms have to be turned off: selection, the callout menu,
           and the double-tap gesture itself (see the event handlers in main.ts —
           CSS alone is not enough in iOS Firefox). */
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        background: #000;
        overflow: hidden;
        position: fixed;
        inset: 0;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        /* Repeated on the canvas itself rather than inherited: this is the
           element every gameplay tap lands on. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      .ctl {
        background: rgba(12, 15, 22, 0.82);
        color: #cfdcf2;
        border: 1px solid #26314a;
        border-radius: 4px;
        font: 11px/1 ui-monospace, 'SFMono-Regular', Menlo, monospace;
        letter-spacing: 0.06em;
        padding: 10px 12px;
        cursor: pointer;
        -webkit-user-select: none;
        user-select: none;
        white-space: nowrap;
      }
      .ctl:active {
        background: #1a2233;
      }

      /* Bottom-right cluster, out of the way of the action, which happens in the
         upper two thirds of the screen. Laid out with flex rather than absolute
         offsets so the flag button can grow a counter without colliding with its
         neighbour.
         Order matters: the rightmost button is the easiest to reach with a thumb,
         so the flag — pressed during play — sits there and RESET sits furthest
         away, since an accidental RESET costs a run. */
      #controls {
        position: absolute;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
        right: calc(env(safe-area-inset-right, 0px) + 10px);
        z-index: 5;
        display: flex;
        gap: 8px;
        /* The container is only a layout box; a tap in the gap between buttons
           must fall through to the game rather than being swallowed. */
        pointer-events: none;
      }
      #controls .ctl {
        pointer-events: auto;
      }
      #flag.hit {
        border-color: #ffcd32;
        color: #ffe27a;
      }
      /* Warned state: a second tap will discard flagged moments that were never
         sent, so it says so rather than silently throwing them away. */
      #reset.armed {
        border-color: #ff5566;
        color: #ff9aa8;
      }

      #tune {
        position: absolute;
        inset: 0;
        z-index: 10;
        background: rgba(0, 0, 0, 0.96);
        display: none;
        flex-direction: column;
        gap: 8px;
        padding: calc(env(safe-area-inset-top, 0px) + 14px)
          calc(env(safe-area-inset-right, 0px) + 14px)
          calc(env(safe-area-inset-bottom, 0px) + 14px)
          calc(env(safe-area-inset-left, 0px) + 14px);
      }
      #tune.open {
        display: flex;
      }
      #tune h1 {
        font: 600 12px/1.4 ui-monospace, monospace;
        letter-spacing: 0.12em;
        color: #eef3fb;
        margin: 0;
      }
      #tuneNote {
        font: 10px/1.5 ui-monospace, monospace;
        color: #8595b0;
      }
      #tuneRows {
        flex: 1 1 0;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .tuneGroup {
        font: 600 9px/1 ui-monospace, monospace;
        letter-spacing: 0.16em;
        color: #6d7c9b;
        margin: 12px 0 6px;
      }
      .tuneRow {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .tuneRow .tl {
        font: 10px/1 ui-monospace, monospace;
        letter-spacing: 0.06em;
        color: #b98cff;
        width: 84px;
        flex: 0 0 auto;
      }
      .tuneRow input[type='range'] {
        flex: 1 1 0;
        min-width: 0;
        accent-color: #b98cff;
        height: 26px;
      }
      .tuneRow .tv {
        font: 11px/1 ui-monospace, monospace;
        color: #eef3fb;
        width: 46px;
        text-align: right;
        flex: 0 0 auto;
      }
      .tuneHint {
        font: 9px/1.4 ui-monospace, monospace;
        color: #55627d;
        margin: 2px 0 8px 94px;
      }
      #tuneFoot {
        display: flex;
        gap: 8px;
      }
      #tuneFoot .ctl {
        flex: 1 1 auto;
        min-width: 0;
        text-align: center;
      }

      #debug {
        position: absolute;
        inset: 0;
        z-index: 10;
        background: rgba(0, 0, 0, 0.96);
        display: none;
        flex-direction: column;
        gap: 10px;
        padding: calc(env(safe-area-inset-top, 0px) + 14px)
          calc(env(safe-area-inset-right, 0px) + 14px)
          calc(env(safe-area-inset-bottom, 0px) + 14px)
          calc(env(safe-area-inset-left, 0px) + 14px);
      }
      #debug.open {
        display: flex;
      }
      #debug h1 {
        font: 600 12px/1.4 ui-monospace, monospace;
        letter-spacing: 0.12em;
        color: #eef3fb;
        margin: 0;
      }
      #debugMeta,
      #debugBuild {
        font: 10px/1.6 ui-monospace, monospace;
        color: #8595b0;
        white-space: pre-wrap;
      }
      #debugBuild {
        color: #5b6a86;
      }
      /* The report has to be selectable and copyable, so the callout comes back
         here — this is the one place a loupe is wanted. */
      #debugNote,
      #debugOut {
        -webkit-touch-callout: default;
        -webkit-user-modify: read-write-plaintext-only;
        display: block;
        width: 100%;
        background: #070a11;
        color: #eef3fb;
        border: 1px solid #26314a;
        border-radius: 3px;
        font: 11px/1.5 ui-monospace, monospace;
        padding: 9px;
        resize: none;
        -webkit-user-select: text;
        user-select: text;
      }
      #debugNote {
        flex: 0 0 72px;
      }
      #debugOut {
        flex: 1 1 0;
        /* Flex items default to min-height:auto and refuse to shrink; without
           this the output box pushes the buttons off the bottom. */
        min-height: 60px;
      }
      #debugRow {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      #debugRow .ctl {
        flex: 1 1 auto;
        /* Same story horizontally: min-width:auto is why the row overflowed. */
        min-width: 0;
        text-align: center;
      }

      /* Moved to the top right: the bottom left is the fuel gauge's, and the
         bottom right is now the controls'. */
      /* The armed overlay: shown before a run begins, so there is somewhere to
         change the tuning and each run starts from a decision rather than from
         wherever the last one left off. */
      #armed {
        position: absolute;
        inset: 0;
        z-index: 4;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.55);
        text-align: center;
        pointer-events: none;
      }
      #armed.hidden {
        display: none;
      }
      #armedTitle {
        font: 600 26px/1.2 ui-monospace, 'SFMono-Regular', Menlo, monospace;
        letter-spacing: 0.3em;
        color: #cfc0ff;
        text-indent: 0.3em;
      }
      #armedHint {
        margin-top: 14px;
        font: 12px/1.4 ui-monospace, monospace;
        letter-spacing: 0.18em;
        color: #eef3fb;
      }
      #armedSub {
        margin-top: 8px;
        font: 10px/1.5 ui-monospace, monospace;
        letter-spacing: 0.06em;
        color: #7b88a4;
      }

      /* The overlay itself is pointer-transparent so a tap anywhere starts the
         run; the one control on it has to opt back in. */
      #armedMap {
        margin-top: 26px;
        pointer-events: auto;
      }
      #armedMap .ctl {
        letter-spacing: 0.14em;
      }
      /* Not a control, and deliberately quiet: it answers "which field is this?"
         for a report, and is never something to read before playing. */
      #armedSeed {
        margin-top: 8px;
        font: 9px/1.4 ui-monospace, monospace;
        letter-spacing: 0.1em;
        color: #46516b;
      }

      #note {
        position: absolute;
        right: calc(env(safe-area-inset-right, 0px) + 10px);
        top: calc(env(safe-area-inset-top, 0px) + 10px);
        color: #46516b;
        font-size: 9px;
        letter-spacing: 0.06em;
        text-align: right;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="controls">
      <button class="ctl" id="tuneBtn">TUNE</button>
      <button class="ctl" id="reset">RESET</button>
      <button class="ctl" id="debugBtn">DEBUG</button>
      <button class="ctl" id="flag">⚑</button>
    </div>

    <div id="tune">
      <h1>TUNE</h1>
      <div id="tuneNote">Changes apply to the next run. Start a run to lock them in.</div>
      <div id="tuneRows"></div>
      <div id="tuneFoot">
        <button class="ctl" id="tuneCam">CAM: ORBIT-LOCK</button>
        <button class="ctl" id="tuneReset">DEFAULTS</button>
        <button class="ctl" id="tuneClose">CLOSE</button>
      </div>
    </div>

    <div id="debug">
      <h1>DEBUG DIAGNOSTICS</h1>
      <div id="debugMeta"></div>
      <div id="debugBuild"></div>
      <textarea
        id="debugNote"
        placeholder="What felt wrong? (e.g. 'the settle jerked here', 'grab was refused but I had room')"
      ></textarea>
      <textarea id="debugOut" readonly spellcheck="false"></textarea>
      <div id="debugRow">
        <button class="ctl" id="debugSend">SEND</button>
        <button class="ctl" id="debugCopy">COPY</button>
        <button class="ctl" id="debugClose">CLOSE</button>
      </div>
    </div>

    <div id="armed">
      <div id="armedInner">
        <div id="armedTitle">APHELION</div>
        <div id="armedHint">tap to start</div>
        <div id="armedSub">
          press and hold near a planet to be caught by it</br>
          hold longer to orbit
        </div>
        <div id="armedMap">
          <button class="ctl" id="newMap">⟳ NEW MAP</button>
          <div id="armedSeed"></div>
        </div>
      </div>
    </div>

    <div id="note">APHELION Prototype v0</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
