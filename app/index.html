<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Mobile portrait is the design target (ADR-0010): the viewport is pinned
         so a double-tap cannot zoom the game out from under a player whose
         entire input is tapping, and `viewport-fit=cover` lets the field reach
         under the notch while the safe-area insets keep readable things out of
         it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <!-- VOID. The sky is the darkest thing on screen and the browser chrome
         should not be brighter than it. -->
    <meta name="theme-color" content="#000000" />
    <title>Aphelion</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        /* iOS raises a selection loupe and a Look Up menu on a long press or a
           quick double tap. The game's whole input is pressing and holding, so
           all three mechanisms — selection, the callout menu and the gesture —
           are turned off here. */
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        background: #000;
        overflow: hidden;
        /* `position: fixed` rather than `overflow: hidden` alone: iOS Safari
           rubber-bands the document on a drag regardless of the latter. */
        position: fixed;
        inset: 0;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* The game. Everything the player reads is drawn inside it, in world space
         in design coordinates (spec 00 §7). */
      #app {
        position: absolute;
        inset: 0;
      }
      /* Developer chrome, and spec 00 §7 rules that DOM is nothing else. It sits
         at the top because the bottom third of the screen is the thumb's, and a
         button there would eat presses meant for the game. */
      #chrome {
        position: absolute;
        top: max(8px, env(safe-area-inset-top));
        left: max(8px, env(safe-area-inset-left));
        right: max(8px, env(safe-area-inset-right));
        color: #46516b;
        font:
          10px/1.6 ui-monospace,
          'SFMono-Regular',
          Menlo,
          monospace;
        letter-spacing: 0.14em;
        pointer-events: none;
      }
      #top {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
      }
      #readout {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* The one place on the page that is text and is meant to behave like it:
         the note a dispatch carries. The blanket rules above are for a surface
         nobody reads, and applied here they take away selecting, correcting and
         pasting — so the chrome asks for them back. `app/input.ts` makes the
         same exemption for the events. */
      #chrome input {
        -webkit-touch-callout: default;
        -webkit-user-select: text;
        user-select: text;
      }
      #chrome button,
      #chrome input {
        pointer-events: auto;
        flex: none;
        background: transparent;
        border: 1px solid #2a2740;
        border-radius: 3px;
        color: #46516b;
        font: inherit;
        letter-spacing: inherit;
        padding: 6px 10px;
        touch-action: manipulation;
      }
      /* The dev row: the recorder's controls. Hidden unless `main.ts` un-hides
         it, which it does only under `import.meta.env.DEV` — a production build
         has no endpoint to send to (ADR-0003) and drops the code that would. */
      #dev {
        display: flex;
        gap: 8px;
        margin-top: 6px;
      }
      #dev[hidden] {
        display: none;
      }
      #note {
        flex: 1;
        min-width: 0;
      }
      /* The tuning panel, and it is dev chrome like everything else in #chrome:
         `main.ts` un-hides it only under `import.meta.env.DEV`. It sits under the
         dev row and above the thumb's third, and it is a panel rather than a
         dialog on purpose — a modal that took focus would swallow the presses the
         game is made of, and the whole point is to watch the coat move while the
         run is still being flown. */
      #tune {
        margin-top: 6px;
        padding: 10px 12px 12px;
        border: 1px solid #2a2740;
        border-radius: 3px;
        background: #0a0814e6;
        pointer-events: auto;
        max-width: 420px;
      }
      #tune[hidden] {
        display: none;
      }
      #tune .row {
        margin-top: 12px;
        display: flex;
        gap: 10px;
        align-items: baseline;
        justify-content: space-between;
      }
      #tune .what {
        margin: 6px 0 0;
        color: #3a4258;
        letter-spacing: 0.06em;
        line-height: 1.5;
      }
      /* Wide enough to drag accurately with a thumb, and its own row, because a
         slider sharing a row with a label is a slider that is hard to grab.

         The track is styled rather than left to `accent-color` because a default
         range control paints a white track, and white is the loudest thing a
         browser has: dropped on this page it is brighter than the craft, which
         Direction 01 makes the brightest thing on screen always. Chrome is
         developer furniture and still may not out-shout the game it is furniture
         for — so the track is DUSK at a low strength and the thumb is DUSK. */
      #tune input[type='range'] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        margin: 10px 0 0;
        background: transparent;
        border: 0;
        padding: 0;
        touch-action: pan-y;
      }
      #tune input[type='range']::-webkit-slider-runnable-track {
        height: 3px;
        border-radius: 2px;
        background: #2a2740;
      }
      #tune input[type='range']::-moz-range-track {
        height: 3px;
        border-radius: 2px;
        background: #2a2740;
      }
      #tune input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 22px;
        height: 22px;
        margin-top: -10px;
        border-radius: 50%;
        border: 0;
        background: #6c64a6;
      }
      #tune input[type='range']::-moz-range-thumb {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 0;
        background: #6c64a6;
      }
      #tune .value {
        color: #edeaf7;
      }
      #tune .main {
        color: #3a4258;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="chrome">
      <div id="top"><span id="readout"></span><button id="reset" type="button">RESET</button></div>
      <div id="dev" hidden>
        <button id="flag" type="button">FLAG</button>
        <input id="note" type="text" autocomplete="off" placeholder="what happened" />
        <button id="send" type="button">SEND</button>
        <button id="tuner" type="button" aria-expanded="false" aria-controls="tune">TUNE</button>
      </div>
      <div id="tune" hidden>
        <div class="row">
          <span>RETRO GRADE</span>
          <!-- Both numbers are written by `main.ts` from the constant itself, so
               this file cannot state a default that has drifted from the game's. -->
          <span
            ><span id="gradeValue" class="value"></span> <span id="gradeMain" class="main"></span
          ></span>
        </div>
        <!-- 0 to 1 is the whole of the pass's travel and is spec 14 §2's, not a
             choice made here: 1 is every stage at the ceiling the spec states for
             it. The step is the bench's. -->
        <input id="grade" type="range" min="0" max="1" step="0.05" aria-label="Retro grade" />
        <p class="what">
          spec 14 §2's lift, dither and grain on one knob. 0 is off; 1 is every stage at the ceiling
          the spec states.
        </p>
        <div class="row">
          <span>SCANLINES</span>
          <span
            ><span id="combValue" class="value"></span> <span id="combMain" class="main"></span
          ></span>
        </div>
        <!-- Past spec 14 §2 stage 5's stated 0.06 on purpose: the ceiling is what
             is being tested, and this panel is dev chrome. -->
        <input
          id="comb"
          type="range"
          min="0"
          max="0.3"
          step="0.01"
          aria-label="Scanline strength"
        />
        <div class="row">
          <span>COMB PITCH</span>
          <span
            ><span id="pitchValue" class="value"></span> <span id="pitchMain" class="main"></span
          ></span>
        </div>
        <!-- Design px between rows. §2 says 2, which is 0.67 CSS px on the phone
             and below what the eye resolves; a 240p arcade CRT wants about 10. -->
        <input id="pitch" type="range" min="2" max="24" step="1" aria-label="Scanline pitch" />
        <p class="what">
          This session only &mdash; a reload comes back to main, and a dispatch carries whatever it
          was flown at.
        </p>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
