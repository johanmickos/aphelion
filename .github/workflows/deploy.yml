# Builds the playable app and publishes it to GitHub Pages.
#
# The site is served from a subpath (/aphelion/), which is why vite.config.ts
# sets a relative `base`. Nothing here touches index.html — the prototype is not
# part of the build.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deploys need these; the default GITHUB_TOKEN has neither.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-flight runs finish rather than being cancelled,
# so a queued deploy always publishes a complete build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The full gate, not just `build`: a deploy that ships a build which
      # fails the equality check is worse than no deploy.
      - run: pnpm check
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
