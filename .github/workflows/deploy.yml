# Builds the playable app and publishes it to GitHub Pages.
#
# The site is served from a subpath (/aphelion/), which is why vite.config.ts
# sets a relative `base`. Nothing here touches index.html — the prototype is not
# part of the build.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deploys need these; the default GITHUB_TOKEN has neither.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-flight runs finish rather than being cancelled,
# so a queued deploy always publishes a complete build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `check:ci`, not `check`: everything except `golden:check`. The golden
      # baseline stores numbers captured on the author's machine and compares
      # them against numbers computed now, and the capture path uses
      # Math.sin/cos/atan2 — which V8 approximates differently on x64 than on
      # arm64. It fails here by ~1 ulp for reasons that have nothing to do with
      # the build. The real proof of fidelity is port-equality, which runs the
      # prototype and the port in one process and is inside `pnpm test`.
      - run: pnpm check:ci
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
